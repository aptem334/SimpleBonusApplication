app:
  # Порог, ниже которого операция бессмысленна: и бонус, и комиссия округляются в ноль.
  # Решение зафиксировано в tickets/T-010.md
  #
  # КАВЫЧКИ ОБЯЗАТЕЛЬНЫ. Без них YAML разбирает 0.10 как double и теряет хвостовой
  # ноль: Double.toString(0.10) == "0.1". Ошибка всплыла бы в тексте ошибки
  # («минимум 0.1»), а не где-то глубоко в расчётах.
  min-amount: "0.10"
  initial:
    money: 100000.00
    bonus: 0.00
    bank-commission: 0.00

spring:
  application:
    name: bonus-service
  datasource:
    url: jdbc:h2:mem:bonusdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.bank.bonus: DEBUG
