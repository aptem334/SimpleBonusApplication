app:
  initial:
    money: 100000.00
    bonus: 0.00
    bank-commission: 0.00

spring:
  application:
    name: bonus-service
  datasource:
    url: jdbc:h2:mem:bonusdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.bank.bonus: DEBUG
